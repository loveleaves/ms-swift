<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Chat Template：从结构化 messages 到 token 序列</text>

  <!-- messages box -->
  <rect x="60" y="66" width="360" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">标准化 messages 列表</text>
  <text x="80" y="118" font-size="12.5" fill="#475569" font-family="monospace">[{"role":"system","content":"..."},</text>
  <text x="80" y="140" font-size="12.5" fill="#475569" font-family="monospace"> {"role":"user","content":"问题①"},</text>
  <text x="80" y="162" font-size="12.5" fill="#475569" font-family="monospace"> {"role":"assistant","content":"回复①"},</text>
  <text x="80" y="184" font-size="12.5" fill="#475569" font-family="monospace"> {"role":"user","content":"问题②"},</text>
  <text x="80" y="206" font-size="12.5" fill="#475569" font-family="monospace"> {"role":"assistant","content":"回复②"}]</text>
  <text x="240" y="234" text-anchor="middle" font-size="11.5" fill="#94a3b8">Alpaca / ShareGPT / OpenAI 等原始格式先统一转换为此结构</text>

  <!-- arrow -->
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="430" y1="160" x2="490" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="460" y="146" text-anchor="middle" font-size="12" fill="#334155">Template.encode</text>

  <!-- token sequence -->
  <rect x="500" y="66" width="440" height="190" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">拼接后的 token 序列</text>
  <text x="520" y="116" font-size="12" font-family="monospace" fill="#334155">&lt;|im_start|&gt;system  ... &lt;|im_end|&gt;</text>
  <text x="520" y="138" font-size="12" font-family="monospace" fill="#334155">&lt;|im_start|&gt;user  问题① &lt;|im_end|&gt;</text>
  <text x="520" y="160" font-size="12" font-family="monospace" fill="#166534" font-weight="bold">&lt;|im_start|&gt;assistant  回复① &lt;|im_end|&gt;</text>
  <text x="520" y="182" font-size="12" font-family="monospace" fill="#334155">&lt;|im_start|&gt;user  问题② &lt;|im_end|&gt;</text>
  <text x="520" y="204" font-size="12" font-family="monospace" fill="#166534" font-weight="bold">&lt;|im_start|&gt;assistant  回复② &lt;|im_end|&gt;</text>
  <text x="720" y="232" text-anchor="middle" font-size="11.5" fill="#3b82f6">绿色高亮区间同时是 labels 计算区间（见图2）</text>

  <!-- bottom notes -->
  <rect x="60" y="280" width="880" height="80" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="500" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">不同模型家族的模板细节各异（特殊 token / 角色标记 / 生成提示前缀 / 停止符）</text>
  <text x="500" y="326" text-anchor="middle" font-size="12.5" fill="#7c2d12">ms-swift 通过 ModelMeta 自动绑定模型 ↔ 模板，且训练 (swift sft) 与推理 (swift infer) 复用同一份 Template 实现，</text>
  <text x="500" y="346" text-anchor="middle" font-size="12.5" fill="#7c2d12">从架构上杜绝“训练-推理模板不一致”这一高发隐蔽 bug</text>
</svg>
