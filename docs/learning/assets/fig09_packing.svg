<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Packing：以块对角注意力消除 Padding 浪费</text>

  <!-- before -->
  <text x="500" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">未打包（Padding 对齐到 batch 内最大长度）</text>
  <g font-size="11">
    <rect x="120" y="80" width="120" height="34" fill="#bbf7d0" stroke="#22c55e"/>
    <text x="180" y="102" text-anchor="middle" fill="#166534">样本①(短)</text>
    <rect x="240" y="80" width="500" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4,3"/>
    <text x="490" y="102" text-anchor="middle" fill="#94a3b8">大量 padding（浪费算力）</text>

    <rect x="120" y="122" width="340" height="34" fill="#bae6fd" stroke="#0ea5e9"/>
    <text x="290" y="144" text-anchor="middle" fill="#075985">样本②(中等长度)</text>
    <rect x="460" y="122" width="280" height="34" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4,3"/>
    <text x="600" y="144" text-anchor="middle" fill="#94a3b8">padding</text>

    <rect x="120" y="164" width="620" height="34" fill="#fde68a" stroke="#f59e0b"/>
    <text x="430" y="186" text-anchor="middle" fill="#92400e">样本③(最长，决定batch宽度)</text>
  </g>
  <text x="500" y="220" text-anchor="middle" font-size="12" fill="#ef4444">padding token 不贡献损失，但仍消耗前向/反向计算量</text>

  <!-- after -->
  <text x="500" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Packing 打包后（拼接为接近 max_length 的长序列）</text>
  <g font-size="11">
    <rect x="120" y="270" width="120" height="34" fill="#bbf7d0" stroke="#22c55e"/>
    <text x="180" y="292" text-anchor="middle" fill="#166534">样本①</text>
    <rect x="240" y="270" width="340" height="34" fill="#bae6fd" stroke="#0ea5e9"/>
    <text x="410" y="292" text-anchor="middle" fill="#075985">样本②</text>
    <rect x="580" y="270" width="160" height="34" fill="#fde68a" stroke="#f59e0b"/>
    <text x="660" y="292" text-anchor="middle" fill="#92400e">样本③(部分)</text>
    <!-- boundary markers -->
    <line x1="240" y1="264" x2="240" y2="310" stroke="#1e293b" stroke-width="2"/>
    <line x1="580" y1="264" x2="580" y2="310" stroke="#1e293b" stroke-width="2"/>
  </g>
  <text x="500" y="332" text-anchor="middle" font-size="12" fill="#166534">块对角掩码（cu_seqlens）+ position_ids 重置 ⇒ 各样本互不可见，训练结果与分别训练完全等价</text>
  <text x="500" y="356" text-anchor="middle" font-size="12" fill="#64748b">依赖 Flash Attention 变长接口（flash_attn_varlen）实现，避免存储稠密 T×T 掩码矩阵；ms-swift: --packing true</text>
</svg>
