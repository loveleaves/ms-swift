<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow13" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="hollow13" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#475569" stroke-width="1"/>
    </marker>
  </defs>
  <rect width="1040" height="480" fill="#ffffff"/>
  <text x="520" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Tuner 抽象接口与策略模式（Strategy Pattern）</text>

  <!-- Abstract Tuner interface -->
  <rect x="380" y="56" width="280" height="106" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="520" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" font-style="italic" fill="#1e293b">«abstract» Tuner</text>
  <line x1="392" y1="86" x2="648" y2="86" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="106" font-size="11" font-family="monospace" fill="#334155">+ prepare_model(args, model)</text>
  <text x="410" y="122" font-size="10" fill="#64748b">→ torch.nn.Module</text>
  <text x="400" y="140" font-size="11" font-family="monospace" fill="#334155">+ save_pretrained(model, dir,</text>
  <text x="410" y="154" font-size="10" fill="#64748b">state_dict, safe_serialization)</text>

  <!-- TUNER_MAPPING dispatcher -->
  <rect x="20" y="90" width="220" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="130" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">TUNER_MAPPING[tuner_type]</text>
  <text x="130" y="132" text-anchor="middle" font-size="10.5" fill="#78350f">依据 --tuner_type 一次多态分发</text>
  <line x1="240" y1="120" x2="378" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow13)"/>

  <!-- caller -->
  <rect x="20" y="200" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">SwiftSft.main()</text>
  <text x="130" y="242" text-anchor="middle" font-size="10" fill="#475569">只依赖 Tuner 抽象接口编程</text>
  <line x1="130" y1="200" x2="130" y2="152" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- concrete subclasses -->
  <g font-size="11.5">
    <rect x="60" y="300" width="170" height="56" rx="7" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="145" y="322" text-anchor="middle" font-weight="bold" fill="#1d4ed8">FullTuner</text>
    <text x="145" y="340" text-anchor="middle" font-size="10" fill="#1e3a8a">no-op直通，全部可训练</text>

    <rect x="260" y="300" width="170" height="56" rx="7" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="345" y="322" text-anchor="middle" font-weight="bold" fill="#15803d">LoRATuner</text>
    <text x="345" y="340" text-anchor="middle" font-size="10" fill="#14532d">委托 peft.get_peft_model</text>

    <rect x="460" y="300" width="170" height="56" rx="7" fill="#fdf4ff" stroke="#a855f7"/>
    <text x="545" y="322" text-anchor="middle" font-weight="bold" fill="#7e22ce">AdaLoRATuner</text>
    <text x="545" y="340" text-anchor="middle" font-size="10" fill="#581c87">SVD参数化+动态剪枝</text>

    <rect x="660" y="300" width="170" height="56" rx="7" fill="#fff7ed" stroke="#fb923c"/>
    <text x="745" y="322" text-anchor="middle" font-weight="bold" fill="#c2410c">LLaMAProTuner</text>
    <text x="745" y="340" text-anchor="middle" font-size="10" fill="#7c2d12">插入新Transformer块</text>

    <rect x="860" y="300" width="150" height="56" rx="7" fill="#fef2f2" stroke="#ef4444"/>
    <text x="935" y="322" text-anchor="middle" font-weight="bold" fill="#b91c1c">... 其余8种</text>
    <text x="935" y="340" text-anchor="middle" font-size="10" fill="#7f1d1d">IA3/BOFT/ReFT等</text>
  </g>

  <!-- inheritance arrows (hollow triangle) -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <line x1="145" y1="300" x2="480" y2="165" marker-end="url(#hollow13)"/>
    <line x1="345" y1="300" x2="500" y2="165" marker-end="url(#hollow13)"/>
    <line x1="545" y1="300" x2="540" y2="165" marker-end="url(#hollow13)"/>
    <line x1="745" y1="300" x2="560" y2="165" marker-end="url(#hollow13)"/>
    <line x1="935" y1="300" x2="580" y2="165" marker-end="url(#hollow13)"/>
  </g>

  <rect x="60" y="392" width="950" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="535" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">开闭原则：新增一种微调方式 = 新增一个 Tuner 子类 + 注册进 TUNER_MAPPING</text>
  <text x="535" y="434" text-anchor="middle" font-size="11.5" fill="#475569">调用方（SwiftSft / Trainer / DataCollator）永远不需要修改，也不需要感知具体是哪一种微调方式</text>
  <text x="535" y="452" text-anchor="middle" font-size="11" fill="#64748b">对应 ms-swift 命令行参数：--tuner_type full / lora / adalora / llamapro / adapter / vera / boft / fourierft / reft / longlora / lisa ...</text>
</svg>
