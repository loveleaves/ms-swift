<svg viewBox="0 0 1080 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="1080" height="460" fill="#ffffff"/>
  <text x="540" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">LoRA 技术家族演进脉络</text>

  <!-- center LoRA node -->
  <rect x="470" y="200" width="140" height="60" rx="10" fill="#1d4ed8"/>
  <text x="540" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">LoRA</text>

  <!-- branch: 显存/量化方向 -->
  <text x="150" y="70" font-size="13" font-weight="bold" fill="#0369a1">显存压缩方向</text>
  <rect x="60" y="82" width="180" height="50" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="150" y="112" text-anchor="middle" font-size="12.5" fill="#075985">QLoRA：4-bit量化基座+LoRA</text>

  <!-- branch: 表达能力方向 -->
  <text x="870" y="70" font-size="13" font-weight="bold" fill="#15803d">表达能力提升方向</text>
  <rect x="800" y="82" width="200" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="900" y="102" text-anchor="middle" font-size="12.5" fill="#14532d">DoRA：幅度/方向解耦</text>
  <text x="900" y="120" text-anchor="middle" font-size="11" fill="#166534">逼近全参数微调效果</text>

  <rect x="800" y="145" width="200" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="900" y="164" text-anchor="middle" font-size="12" fill="#14532d">LoRA-GA / LoRA-Pro</text>
  <text x="900" y="180" text-anchor="middle" font-size="11" fill="#166534">梯度感知初始化/优化</text>

  <!-- branch: 秩分配方向 -->
  <text x="150" y="330" font-size="13" font-weight="bold" fill="#b45309">秩预算分配方向</text>
  <rect x="60" y="342" width="180" height="46" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="150" y="362" text-anchor="middle" font-size="12.5" fill="#92400e">AdaLoRA：SVD动态剪枝</text>
  <text x="150" y="378" text-anchor="middle" font-size="11" fill="#b45309">自适应秩重分配</text>

  <!-- branch: 初始化/缩放方向 -->
  <text x="870" y="330" font-size="13" font-weight="bold" fill="#7c3aed">初始化 / 缩放方向</text>
  <rect x="800" y="342" width="200" height="46" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="900" y="362" text-anchor="middle" font-size="12.5" fill="#581c87">PiSSA：主成分SVD初始化</text>
  <text x="900" y="378" text-anchor="middle" font-size="11" fill="#7c3aed">收敛更快</text>

  <rect x="800" y="398" width="200" height="46" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="900" y="418" text-anchor="middle" font-size="12.5" fill="#581c87">rsLoRA：α/√r 稳定缩放</text>
  <text x="900" y="434" text-anchor="middle" font-size="11" fill="#7c3aed">支持更大秩</text>

  <!-- branch: 优化策略 -->
  <rect x="60" y="398" width="180" height="46" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="150" y="418" text-anchor="middle" font-size="12.5" fill="#92400e">LoRA+：A/B 差异化学习率</text>
  <text x="150" y="434" text-anchor="middle" font-size="11" fill="#b45309">加快收敛</text>

  <!-- branch: 平行路线 GaLore -->
  <rect x="440" y="330" width="200" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="540" y="352" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">GaLore（平行路线）</text>
  <text x="540" y="370" text-anchor="middle" font-size="11" fill="#b91c1c">梯度低秩投影 · 全参数更新</text>
  <text x="540" y="384" text-anchor="middle" font-size="11" fill="#b91c1c">非PEFT，以低秩降显存</text>

  <!-- connecting lines -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M470 220 C 350 220, 260 140, 150 132"/>
    <path d="M610 220 C 730 200, 780 130, 800 115"/>
    <path d="M610 240 C 730 240, 780 190, 800 168"/>
    <path d="M470 240 C 350 260, 260 340, 150 342"/>
    <path d="M470 250 C 350 300, 260 400, 150 405"/>
    <path d="M610 250 C 730 280, 780 340, 800 365"/>
    <path d="M610 255 C 730 310, 780 400, 800 421"/>
    <path d="M540 260 L 540 330"/>
  </g>

  <text x="540" y="30" text-anchor="middle" font-size="1" fill="none"> </text>
</svg>
