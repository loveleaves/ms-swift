<svg viewBox="0 0 1160 760" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow12" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1160" height="760" fill="#ffffff"/>
  <text x="580" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">Full 参数训练 vs LoRA 训练：端到端调用链时序对比（分野—汇流—分野）</text>

  <!-- lifelines column headers -->
  <g font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">
    <text x="90" y="58">CLI/参数解析</text>
    <text x="255" y="58">模型/模板/数据加载</text>
    <text x="460" y="58">Tuner.prepare_model()</text>
    <text x="660" y="58">优化器 / 并行引擎</text>
    <text x="860" y="58">Trainer 训练循环</text>
    <text x="1040" y="58">Checkpoint 保存</text>
  </g>
  <!-- lifelines -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="90" y1="66" x2="90" y2="720"/>
    <line x1="255" y1="66" x2="255" y2="720"/>
    <line x1="460" y1="66" x2="460" y2="720"/>
    <line x1="660" y1="66" x2="660" y2="720"/>
    <line x1="860" y1="66" x2="860" y2="720"/>
    <line x1="1040" y1="66" x2="1040" y2="720"/>
  </g>

  <!-- shared trunk box -->
  <rect x="55" y="80" width="440" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="275" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">① 共享干路（Full / LoRA 完全一致）</text>
  <text x="275" y="124" text-anchor="middle" font-size="11.5" fill="#334155">SftArguments 解析 → get_model_processor() → get_template() → load_dataset()</text>
  <text x="275" y="140" text-anchor="middle" font-size="11" fill="#64748b">此阶段代码零差异，不存在 tuner_type 分支判断</text>

  <!-- divergence point 1 label -->
  <text x="460" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">◆ 第一分野点</text>
  <line x1="495" y1="115" x2="435" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Full branch (top) -->
  <rect x="410" y="188" width="640" height="112" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="425" y="206" font-size="12" font-weight="bold" fill="#1d4ed8">Full：Tuner 为 no-op 直通</text>
  <text x="425" y="224" font-size="11" fill="#1e3a8a">requires_grad_(True) 覆盖全部参数</text>
  <line x1="595" y1="215" x2="655" y2="215" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow12)"/>
  <text x="670" y="212" font-size="10.5" fill="#1e3a8a">优化器覆盖 100% 参数</text>
  <text x="670" y="228" font-size="10.5" fill="#1e3a8a">需 ZeRO-3：动态 All-Gather 参数分片</text>
  <line x1="850" y1="222" x2="855" y2="222" stroke="#3b82f6" stroke-width="2"/>
  <text x="870" y="248" font-size="10.5" fill="#1e3a8a">反向传播：全部参数产生梯度</text>
  <text x="870" y="264" font-size="10.5" fill="#1e3a8a">梯度同步通信量 ∝ 全部参数量</text>
  <text x="425" y="286" font-size="10.5" fill="#1e3a8a">显存/速度画像：优化器状态与梯度开销最大</text>

  <!-- LoRA branch (bottom) -->
  <rect x="410" y="316" width="640" height="132" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="425" y="334" font-size="12" font-weight="bold" fill="#15803d">LoRA：注入 lora_A/lora_B，冻结基座</text>
  <text x="425" y="352" font-size="11" fill="#14532d">target_modules 线性层替换为 lora.Linear</text>
  <text x="425" y="368" font-size="11" fill="#14532d">requires_grad=False（基座）/ True（A/B）</text>
  <line x1="595" y1="352" x2="655" y2="352" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow12)"/>
  <text x="670" y="349" font-size="10.5" fill="#14532d">优化器仅覆盖 0.1%~5% 参数</text>
  <text x="670" y="365" font-size="10.5" fill="#14532d">ZeRO-2 通常已足够</text>
  <line x1="850" y1="358" x2="855" y2="358" stroke="#16a34a" stroke-width="2"/>
  <text x="870" y="392" font-size="10.5" fill="#14532d">反向传播仍需流经冻结层</text>
  <text x="870" y="408" font-size="10.5" fill="#14532d">（激活值显存不因 PEFT 减少）</text>
  <text x="425" y="432" font-size="10.5" fill="#14532d">显存/速度画像：优化器状态与梯度开销降低1~2个数量级</text>

  <!-- reconverge box -->
  <rect x="700" y="470" width="240" height="90" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="820" y="490" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">② 汇流：训练循环主干</text>
  <text x="820" y="508" text-anchor="middle" font-size="10.5" fill="#334155">outputs=model(**batch)</text>
  <text x="820" y="524" text-anchor="middle" font-size="10.5" fill="#334155">loss.backward(); optimizer.step()</text>
  <text x="820" y="540" text-anchor="middle" font-size="10.5" fill="#334155">Full/LoRA 完全复用同一实现</text>

  <text x="1040" y="590" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">◆ 第二分野点</text>
  <line x1="945" y1="500" x2="1010" y2="595" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- checkpoint branches -->
  <rect x="920" y="606" width="220" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1030" y="626" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1d4ed8">Full：完整 state_dict 分片写出</text>
  <text x="1030" y="644" text-anchor="middle" font-size="10" fill="#1e3a8a">ZeRO-3 需先聚合(Gather)权重</text>

  <rect x="920" y="666" width="220" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1030" y="686" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">LoRA：仅adapter权重+config</text>
  <text x="1030" y="704" text-anchor="middle" font-size="10" fill="#14532d">通常几十~几百MB，秒级完成</text>

  <text x="580" y="748" text-anchor="middle" font-size="12" fill="#475569">设计原则：训练范式无关能力沉淀为共享干路，范式相关差异收敛到"Tuner注入"与"Checkpoint保存"两个最小接缝</text>
</svg>
